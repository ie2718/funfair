<style>
/* Layout: full-bleed 3D viewport; one stone-grey field card docked top-left (bottom sheet on phones); cinnabar used only for the seal and active states */
:root{
  --bg:#cdd4d8;
  --panel:rgba(244,245,243,.9);
  --ink:#1b1f22;
  --muted:#58626a;
  --rule:rgba(27,31,34,.14);
  --chip:rgba(27,31,34,.06);
  --accent:#a8341c;
  --on-accent:#fbf4ee;
  --f-display:"Noto Serif SC","Songti SC","STSong",serif;
  --f-body:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d1114; --panel:rgba(17,21,24,.86); --ink:#e9e6e0; --muted:#9ba4aa;
    --rule:rgba(233,230,224,.14); --chip:rgba(233,230,224,.07); --accent:#e0633e; --on-accent:#1a0d08;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0d1114; --panel:rgba(17,21,24,.86); --ink:#e9e6e0; --muted:#9ba4aa;
  --rule:rgba(233,230,224,.14); --chip:rgba(233,230,224,.07); --accent:#e0633e; --on-accent:#1a0d08;
  color-scheme:dark;
}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px}
#app{position:fixed;inset:0}
#app canvas{display:block;touch-action:none}
.ui{
  position:fixed;inset:0;pointer-events:none;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-bottom, 0px));
  display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;
}
.card{
  pointer-events:auto;width:min(340px,100%);max-height:100%;overflow:auto;
  background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border:1px solid var(--rule);border-radius:6px;padding:16px 18px;
  display:flex;flex-direction:column;gap:14px;
}
.head{display:flex;gap:14px;align-items:center}
.seal{
  flex:none;writing-mode:vertical-rl;font-family:var(--f-display);font-weight:900;font-size:15px;letter-spacing:.12em;
  background:var(--accent);color:var(--on-accent);padding:8px 5px;border-radius:3px;line-height:1;
}
h1{margin:0;font-family:var(--f-display);font-weight:900;font-size:28px;letter-spacing:.08em;line-height:1.15;text-wrap:balance}
.sub{margin:4px 0 0;color:var(--muted);font-size:12.5px;letter-spacing:.02em}
details{border-top:1px solid var(--rule);padding-top:10px}
summary{cursor:pointer;font-size:11.5px;color:var(--muted);letter-spacing:.14em;list-style:none;display:flex;justify-content:space-between}
summary::-webkit-details-marker{display:none}
summary::after{content:"＋";font-size:11px}
details[open] summary::after{content:"－"}
summary:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.facts{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:10px 0 0}
.facts dt{color:var(--muted);font-size:12.5px}
.facts dd{margin:0;font-variant-numeric:tabular-nums;font-size:13px;min-width:0}
.facts dd b{font-family:var(--f-display);font-weight:600;font-size:14px}
.note{margin:10px 0 0;font-size:11.5px;line-height:1.6;color:var(--muted)}
.group{display:flex;flex-direction:column;gap:6px}
.group > span{font-size:11.5px;color:var(--muted);letter-spacing:.14em}
.row{display:flex;flex-wrap:wrap;gap:6px}
button{
  font:inherit;font-size:13px;color:var(--ink);background:var(--chip);border:1px solid var(--rule);
  padding:5px 11px;border-radius:4px;cursor:pointer;transition:background .15s,border-color .15s;
}
button:hover{border-color:var(--muted)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.sun{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--muted)}
.sun input{flex:1;accent-color:var(--accent);min-width:0}
.hint{pointer-events:none;margin:0;font-size:12px;color:var(--ink);opacity:.7;background:var(--panel);padding:4px 10px;border-radius:4px}
#loading{
  position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);color:var(--muted);
  font-family:var(--f-display);font-size:16px;letter-spacing:.3em;transition:opacity .6s;pointer-events:none;
}
.lv{
  font-family:var(--f-body);font-size:11.5px;color:#fff;background:rgba(20,22,24,.62);padding:2px 7px;border-radius:3px;
  white-space:nowrap;font-variant-numeric:tabular-nums;border-left:2px solid #e0633e;
}
.lv b{font-family:var(--f-display);font-weight:600;margin-right:6px}
@media (max-width:640px){
  .ui{justify-content:flex-end}
  .card{width:100%;max-height:52%;padding:12px 14px;gap:10px}
  h1{font-size:22px}
  .hint{display:none}
}
@media (prefers-reduced-motion: reduce){ #loading{transition:none} }
</style>

<body>

<div id="app"></div>
<div class="ui">
  <aside class="card" aria-label="应县木塔模型说明与控制">
    <header class="head">
      <div class="seal">释迦塔</div>
      <div>
        <h1>应县木塔</h1>
        <p class="sub">佛宫寺释迦塔 · 辽清宁二年（1056）· 山西应县</p>
      </div>
    </header>
    <details id="facts" open>
      <summary>形制数据</summary>
      <dl class="facts">
        <dt>通高</dt><dd><b>67.31</b> m（梁思成逐层实测）</dd>
        <dt>底层直径</dt><dd><b>30.27</b> m，八角形平面</dd>
        <dt>层数</dt><dd>外观五层，明五暗四共九层</dd>
        <dt>屋檐</dt><dd>五层六檐，底层副阶周匝</dd>
        <dt>柱网</dt><dd>每层外槽 24 柱、内槽 8 柱</dd>
        <dt>斗拱</dt><dd>全塔 54 种，上简下繁</dd>
        <dt>台基</dt><dd>约 4 m，下方上八角两层</dd>
        <dt>塔刹</dt><dd>铁刹：仰莲、覆钵、五重相轮、圆光、仰月、宝盖、宝珠，8 条铁链</dd>
      </dl>
      <p class="note">尺寸依公开资料推算建模，层高与出檐为估算值，并非测绘精度。剖切后可看到一层约 10 m 的释迦坐像和各层塑像的位置。</p>
    </details>
    <div class="group">
      <span>视角</span>
      <div class="row">
        <button id="v-all" type="button">全景</button>
        <button id="v-dou" type="button">斗拱</button>
        <button id="v-top" type="button">塔刹</button>
        <button id="v-base" type="button">台基</button>
      </div>
    </div>
    <div class="group">
      <span>显示</span>
      <div class="row">
        <button id="t-cut" type="button" aria-pressed="false">剖切</button>
        <button id="t-lab" type="button" aria-pressed="false">层位标注</button>
        <button id="t-rot" type="button" aria-pressed="true">自动旋转</button>
      </div>
    </div>
    <label class="sun" for="sun">日照高度<input id="sun" type="range" min="4" max="75" value="34"></label>
  </aside>
  <p class="hint">拖动旋转 · 滚轮或双指缩放 · 右键平移</p>
</div>
<div id="loading">营造中</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const V3 = THREE.Vector3;
const T8 = Math.tan(Math.PI / 8), C8 = Math.cos(Math.PI / 8), Q = Math.PI / 4;
const isSmall = Math.min(innerWidth, innerHeight) < 640;

/* ================================================================
   尺寸表（米，地面 = 0）。八角形以“对边距”的一半（apothem）记，
   面 0 朝南（+z），面 i 的法线方位角 = i·45°。
   ================================================================ */
const BASE = 4.0;                                    // 台基顶面
const DIM = {
  platLow: { half: 20.5, h: 1.9 },                   // 下层方台
  platUp:  { a: 17.7, h: 2.1 },                      // 上层八角台，对边 35.4 m
  fujie: { a: 15.1, colH: 4.0, colR: 0.3, brH: 1.1, tiers: 2,      // 副阶，对边 30.2 m
           roof: { aIn: 11.85, aOut: 17.6, yIn: 10.8, yOut: 8.8, lift: 0.35, ext: 0.5 } },
  l1:    { a: 11.8, colH: 8.7, colR: 0.42, brH: 2.4, tiers: 4, ang: true,
           roof: { aIn: 11.0, aOut: 15.9, yIn: 16.2, yOut: 14.7, lift: 0.55, ext: 0.8 } },
  upper: [],
  finialTop: 67.31,
};
{
  const colA = [11.2, 10.6, 10.0, 9.4], tiers = [4, 4, 3, 3];
  let p0 = DIM.l1.roof.yIn;
  for (let j = 0; j < 4; j++) {
    const a = colA[j], deckY = p0 + 2.2, top = j === 3;
    const roof = top
      ? { aIn: 0.9, aOut: a + 4.0, yIn: 56.0, yOut: deckY + 5.0, lift: 0.7, ext: 0.9 }
      : { aIn: a - 0.8, aOut: a + 4.0, yIn: deckY + 6.6, yOut: deckY + 5.0, lift: 0.5, ext: 0.75 };
    DIM.upper.push({ j, a, p0, deckY, deckA: a + 1.6, pzA: a + 0.15, pzBrH: 1.9,
      colH: 3.0, colR: 0.36, brH: 2.4, tiers: tiers[j], ang: tiers[j] === 4, roof, top });
    p0 = roof.yIn;
  }
}
const FINIAL_BASE = DIM.upper[3].roof.yIn;          // 56.0
console.assert(Math.abs(FINIAL_BASE + 11.31 - DIM.finialTop) < 1e-6, 'stack height mismatch');

/* ---------------- 渲染器 / 场景 ---------------- */
const app = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.localClippingEnabled = true;
app.appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'absolute', inset: '0', pointerEvents: 'none' });
app.appendChild(labelRenderer.domElement);

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.35;

const camera = new THREE.PerspectiveCamera(36, innerWidth / innerHeight, 0.5, 2500);
camera.position.set(74, 26, 108);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 31, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 6;
controls.maxDistance = 320;
controls.maxPolarAngle = Math.PI * 0.495;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.35;

/* 天空 */
const skyU = { top: { value: new THREE.Color() }, hor: { value: new THREE.Color() }, bot: { value: new THREE.Color(0x8d806a) } };
const sky = new THREE.Mesh(new THREE.SphereGeometry(1000, 32, 16), new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false, uniforms: skyU,
  vertexShader: `varying vec3 vP; void main(){ vP = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.); }`,
  fragmentShader: `uniform vec3 top, hor, bot; varying vec3 vP;
    void main(){ float h = vP.y; vec3 c = mix(hor, top, smoothstep(0.0, 0.5, h)); c = mix(c, bot, smoothstep(0.0, -0.08, h));
      gl_FragColor = vec4(c, 1.0);
      #include <tonemapping_fragment>
      #include <colorspace_fragment>
    }`,
}));
sky.renderOrder = -1;
scene.add(sky);
scene.fog = new THREE.Fog(0xd8d4c8, 180, 1000);

const hemi = new THREE.HemisphereLight(0xcfe0f5, 0x7a6a52, 0.9);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff0dc, 2.6);
sun.castShadow = true;
sun.shadow.mapSize.set(isSmall ? 2048 : 4096, isSmall ? 2048 : 4096);
Object.assign(sun.shadow.camera, { left: -48, right: 48, top: 48, bottom: -48, near: 1, far: 420 });
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.04;
sun.target.position.set(0, 28, 0);
scene.add(sun, sun.target);

function setSun(elevDeg) {
  const e = THREE.MathUtils.degToRad(elevDeg), az = THREE.MathUtils.degToRad(-38);
  const d = new V3(Math.sin(az) * Math.cos(e), Math.sin(e), Math.cos(az) * Math.cos(e));
  sun.position.copy(sun.target.position).addScaledVector(d, 180);
  const k = THREE.MathUtils.smoothstep(elevDeg, 4, 40);
  sun.color.setHSL(0.08 + 0.03 * k, 0.75 - 0.5 * k, 0.6 + 0.3 * k);
  sun.intensity = 1.3 + 1.5 * k;
  hemi.intensity = 0.45 + 0.5 * k;
  skyU.top.value.set(0x34547e).lerp(new THREE.Color(0x6e9ccc), k);
  skyU.hor.value.set(0xe8b98a).lerp(new THREE.Color(0xe4e2da), k);
  scene.fog.color.copy(skyU.hor.value);
}

/* ---------------- 程序贴图 ---------------- */
function canvasTex(w, h, draw, { srgb = true, repeat = true } = {}) {
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  draw(cv.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(cv);
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  if (repeat) t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return t;
}
const rnd = (() => { let s = 7; return () => (s = (s * 16807) % 2147483647) / 2147483647; })();

function drawTiles(g, w, h, gray) {
  // 两垄筒瓦 / 周期，横向瓦缝
  g.fillStyle = gray ? '#202020' : '#45443f'; g.fillRect(0, 0, w, h);
  const cols = 2, cw = w / cols;
  for (let c = 0; c < cols; c++) {
    const gr = g.createLinearGradient(c * cw, 0, (c + 1) * cw, 0);
    if (gray) { gr.addColorStop(0, '#111'); gr.addColorStop(0.18, '#555'); gr.addColorStop(0.5, '#eee'); gr.addColorStop(0.82, '#555'); gr.addColorStop(1, '#111'); }
    else { gr.addColorStop(0, '#3e3d3a'); gr.addColorStop(0.2, '#6e6c66'); gr.addColorStop(0.45, '#9c988e'); gr.addColorStop(0.8, '#64625c'); gr.addColorStop(1, '#3e3d3a'); }
    g.fillStyle = gr; g.fillRect(c * cw + cw * 0.12, 0, cw * 0.76, h);
  }
  for (let y = 0; y < h; y += h / 4) {
    g.fillStyle = gray ? 'rgba(0,0,0,.8)' : 'rgba(10,10,10,.55)'; g.fillRect(0, y, w, 3);
    g.fillStyle = gray ? 'rgba(255,255,255,.25)' : 'rgba(255,255,255,.08)'; g.fillRect(0, y + 3, w, 2);
  }
  if (!gray) for (let i = 0; i < 900; i++) {
    g.fillStyle = rnd() < 0.5 ? `rgba(160,140,100,${rnd() * 0.12})` : `rgba(0,0,0,${rnd() * 0.15})`;
    g.fillRect(rnd() * w, rnd() * h, 2 + rnd() * 5, 2 + rnd() * 5);
  }
}
const tileTex = canvasTex(256, 256, (g, w, h) => drawTiles(g, w, h, false));
const tileBump = canvasTex(256, 256, (g, w, h) => drawTiles(g, w, h, true), { srgb: false });

const woodTex = canvasTex(256, 256, (g, w, h) => {
  g.fillStyle = '#d6d6d6'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 260; i++) {
    const x = rnd() * w, l = 30 + rnd() * 160;
    g.strokeStyle = rnd() < 0.5 ? `rgba(255,255,255,${rnd() * 0.18})` : `rgba(0,0,0,${rnd() * 0.18})`;
    g.lineWidth = 1 + rnd() * 2.5; g.beginPath(); g.moveTo(x, rnd() * h); g.lineTo(x + rnd() * 4 - 2, rnd() * h + l); g.stroke();
  }
});
const plasterTex = canvasTex(256, 256, (g, w, h) => {
  g.fillStyle = '#e6e6e6'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 160; i++) {
    const r = 6 + rnd() * 40;
    const gr = g.createRadialGradient(0, 0, 0, 0, 0, r);
    const a = rnd() * 0.08; gr.addColorStop(0, rnd() < 0.6 ? `rgba(90,70,50,${a})` : `rgba(255,255,255,${a})`); gr.addColorStop(1, 'rgba(0,0,0,0)');
    g.save(); g.translate(rnd() * w, rnd() * h); g.fillStyle = gr; g.fillRect(-r, -r, r * 2, r * 2); g.restore();
  }
});
function stoneTex(rows, cols) {
  return canvasTex(512, 512, (g, w, h) => {
    g.fillStyle = '#8a8478'; g.fillRect(0, 0, w, h);
    for (let i = 0; i < 4000; i++) { g.fillStyle = `rgba(${rnd() < .5 ? '40,36,30' : '255,250,240'},${rnd() * 0.12})`; g.fillRect(rnd() * w, rnd() * h, 2, 2); }
    g.strokeStyle = 'rgba(50,45,38,.55)'; g.lineWidth = 3;
    const rh = h / rows, cw = w / cols;
    for (let r = 0; r < rows; r++) {
      g.beginPath(); g.moveTo(0, r * rh); g.lineTo(w, r * rh); g.stroke();
      for (let c = 0; c < cols; c++) { const x = (c + (r % 2) * 0.5) * cw; g.beginPath(); g.moveTo(x, r * rh); g.lineTo(x, (r + 1) * rh); g.stroke(); }
    }
  });
}
const pavingTex = canvasTex(512, 512, (g, w, h) => {
  g.fillStyle = '#5e5a52'; g.fillRect(0, 0, w, h);
  const n = 8, s = w / n;
  for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) {
    const v = 92 + rnd() * 26; g.fillStyle = `rgb(${v},${v - 4},${v - 12})`; g.fillRect(i * s + 2, j * s + 2, s - 4, s - 4);
  }
});
pavingTex.repeat.set(36, 36);

function doorTex(leaves) {
  return canvasTex(512, 600, (g, w, h) => {
    g.fillStyle = '#3c1d13'; g.fillRect(0, 0, w, h);
    const lw = w / leaves;
    for (let k = 0; k < leaves; k++) {
      const x0 = k * lw + 8, x1 = (k + 1) * lw - 8, y0 = 10, y1 = h - 10;
      g.fillStyle = '#7b3622'; g.fillRect(x0, y0, x1 - x0, y1 - y0);
      const ly1 = y0 + (y1 - y0) * 0.6;
      g.fillStyle = '#140b08'; g.fillRect(x0 + 14, y0 + 14, x1 - x0 - 28, ly1 - y0 - 20);
      g.strokeStyle = '#a35a3a'; g.lineWidth = 5;
      const nx = 5, ny = 9, gx = (x1 - x0 - 28) / nx, gy = (ly1 - y0 - 20) / ny;
      for (let i = 1; i < nx; i++) { g.beginPath(); g.moveTo(x0 + 14 + i * gx, y0 + 14); g.lineTo(x0 + 14 + i * gx, ly1 - 6); g.stroke(); }
      for (let i = 1; i < ny; i++) { g.beginPath(); g.moveTo(x0 + 14, y0 + 14 + i * gy); g.lineTo(x1 - 14, y0 + 14 + i * gy); g.stroke(); }
      g.fillStyle = '#5e2818'; g.fillRect(x0 + 18, ly1 + 14, x1 - x0 - 36, y1 - ly1 - 34);
      g.strokeStyle = '#94492e'; g.lineWidth = 4; g.strokeRect(x0 + 26, ly1 + 22, x1 - x0 - 52, y1 - ly1 - 50);
    }
  }, { repeat: false });
}

/* ---------------- 材质 ---------------- */
const clipPlane = new THREE.Plane(new V3(0, 0, -1), 60);
const towerMats = [];
function M(p) {
  const m = new THREE.MeshStandardMaterial({ roughness: 0.85, metalness: 0, ...p });
  m.clippingPlanes = [clipPlane]; m.clipShadows = true; towerMats.push(m); return m;
}
const stoneSide = stoneTex(3, 6); stoneSide.repeat.set(8, 1);
const stoneOct = stoneTex(3, 6); stoneOct.repeat.set(1, 1);
const mat = {
  col:     M({ color: 0x8a5236, map: woodTex }),
  bracket: M({ color: 0x9c7858, map: woodTex, roughness: 0.9 }),
  dou:     M({ color: 0x5a3b29, map: woodTex, roughness: 0.9 }),

/* ---------------- 几何工具 ---------------- */
const batch = new Map();
const add = (m, g) => { if (!batch.has(m)) batch.set(m, []); batch.get(m).push(g); return g; };
const box = (w, h, d) => new THREE.BoxGeometry(w, h, d);
const put = (g, x, y, z, ry = 0) => { if (ry) g.rotateY(ry); g.translate(x, y, z); return g; };
function octXZ(a, i, u) {
  const p = i * Q, s = Math.sin(p), c = Math.cos(p), t = u * a * T8;
  return [s * a + c * t, c * a - s * t];
}
function cornerXZ(rc, k) { const t = Math.PI / 8 + k * Q; return [rc * Math.sin(t), rc * Math.cos(t)]; }
// 一圈 24 柱位置：每面三间四柱，角柱共用
function ring24(a) {
  const out = [];
  for (let i = 0; i < 8; i++) for (const u of [-1, -1 / 3, 1 / 3]) {
    const [x, z] = octXZ(a, i, u);
    out.push({ x, z, ry: u === -1 ? i * Q - Q / 2 : i * Q, corner: u === -1 });
  }
  return out;
}
// 八角柱体：每面独立法线，带顶底盖
function octPrism(a, y0, h, { caps = true } = {}) {
  const pos = [], nor = [], uv = [], idx = [], rc = a / C8, side = 2 * a * T8, y1 = y0 + h;
  for (let i = 0; i < 8; i++) {
    const [x0, z0] = cornerXZ(rc, i - 1), [x1, z1] = cornerXZ(rc, i), n = [Math.sin(i * Q), 0, Math.cos(i * Q)];
    const b = pos.length / 3;
    pos.push(x0, y0, z0, x1, y0, z1, x0, y1, z0, x1, y1, z1);
    for (let k = 0; k < 4; k++) nor.push(...n);
    uv.push(i / 8, 0, (i + 1) / 8, 0, i / 8, 1, (i + 1) / 8, 1);
    idx.push(b, b + 1, b + 2, b + 1, b + 3, b + 2);
  }
  if (caps) for (const [y, up] of [[y1, 1], [y0, -1]]) {
    const c = pos.length / 3; pos.push(0, y, 0); nor.push(0, up, 0); uv.push(0.5, 0.5);
    for (let k = 0; k < 8; k++) { const [x, z] = cornerXZ(rc, k); pos.push(x, y, z); nor.push(0, up, 0); uv.push(0.5 + x / (2 * rc), 0.5 + z / (2 * rc)); }
    for (let k = 0; k < 8; k++) { const p0 = c + 1 + ((k + 7) % 8), p1 = c + 1 + k; up > 0 ? idx.push(c, p0, p1) : idx.push(c, p1, p0); }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('normal', new THREE.Float32BufferAttribute(nor, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  g.setIndex(idx);
  return g;
}
// 沿八角形一圈的枋 / 梁
function ringBeam(m, a, y, w, h) {
  for (let i = 0; i < 8; i++) {
    const [x, z] = octXZ(a, i, 0);
    add(m, put(box(2 * a * T8 + w * 0.9, h, w), x, y, z, i * Q));
  }
}
function columns(m, a, y0, h, r) {
  for (const p of ring24(a)) add(m, put(new THREE.CylinderGeometry(r * 0.9, r, h, 14), p.x, y0 + h / 2, p.z));
}

/* ---------------- 斗拱 ----------------
   局部坐标：+z 向外出跳，x 沿檐面，y 向上，原点在栌斗底。
   每跳：华拱（出跳）＋ 泥道/慢拱（横拱）＋ 散斗 ＋ 跳头交互斗与瓜子拱；末跳令拱；可加双下昂。 */
const STEP = 0.45, TH = 0.42;
const natH = n => 0.68 + n * TH;
const bracketCache = new Map();
function bracketGeo(n, ang) {
  const key = n + '-' + ang;
  if (bracketCache.has(key)) return bracketCache.get(key);
  const P = [], D = [], bx = (w, h, d, x, y, z, rx = 0) => { const g = box(w, h, d); if (rx) g.rotateX(rx); g.translate(x, y, z); (w === h ? D : (Math.abs(w - d) < 0.05 && h < 0.31 ? D : P)).push(g); };
  bx(0.64, 0.3, 0.64, 0, 0.15, 0);                                   // 栌斗
  for (let k = 0; k < n; k++) {
    const y = 0.3 + k * TH, tip = (k + 1) * STEP;
    bx(0.2, 0.24, tip + 0.5, 0, y + 0.12, (tip - 0.35) / 2);          // 华拱
    const L = k % 2 ? 1.85 : 1.3;
    bx(L, 0.24, 0.2, 0, y + 0.12, 0);                                  // 泥道拱 / 慢拱
    bx(0.28, 0.18, 0.28, L / 2 - 0.14, y + 0.33, 0);                   // 散斗
    bx(0.28, 0.18, 0.28, -(L / 2 - 0.14), y + 0.33, 0);
    bx(0.32, 0.18, 0.32, 0, y + 0.33, tip);                            // 交互斗
    const Lt = k === n - 1 ? 1.5 : 0.95;
    bx(Lt, 0.22, 0.18, 0, y + 0.53, tip);                              // 瓜子拱 / 令拱
    bx(0.24, 0.16, 0.24, Lt / 2 - 0.12, y + 0.72, tip);
    bx(0.24, 0.16, 0.24, -(Lt / 2 - 0.12), y + 0.72, tip);
  }
  const top = 0.3 + n * TH;
  bx(0.2, 0.3, n * STEP + 0.9, 0, top + 0.08, (n * STEP) / 2 + 0.15); // 耍头
  if (ang) {                                                           // 双下昂
    for (let k = 0; k < 2; k++) {
      const len = n * STEP + 1.0;
      bx(0.2, 0.22, len, 0, 0.3 + (n - 2 + k) * TH + 0.05, len / 2 - 0.25, 0.32);
    }
  }
  const g = { arm: mergeGeometries(P), dou: mergeGeometries(D) };
  bracketCache.set(key, g);
  return g;
}
// 一整圈铺作（柱头 + 补间）及其上下枋子
function bracketRing(a, yBase, brH, n, ang, { inter = true } = {}) {
  const s = brH / natH(n), reach = n * STEP * s, base = bracketGeo(n, ang);
  for (const p of ring24(a)) for (const part of ['arm', 'dou']) {
    const g = base[part].clone().scale(s * 0.85, s, p.corner ? s / C8 : s);
    add(part === 'arm' ? mat.bracket : mat.dou, put(g, p.x, yBase, p.z, p.ry));
  }
  if (inter) for (let i = 0; i < 8; i++) for (const u of [-2 / 3, 0, 2 / 3]) for (const part of ['arm', 'dou']) {
    const [x, z] = octXZ(a, i, u);
    add(part === 'arm' ? mat.bracket : mat.dou, put(base[part].clone().scale(s * 0.55, s, s * 0.9), x, yBase, z, i * Q));
  }
  ringBeam(mat.beam, a, yBase - 0.32, 0.34, 0.5);                       // 阑额
  ringBeam(mat.green, a, yBase - 0.05, 0.62, 0.12);                     // 普拍枋
  ringBeam(mat.beam, a, yBase + (0.3 + TH * 1.5) * s, 0.2, 0.24 * s);   // 柱头枋
  ringBeam(mat.beam, a + reach * 0.5, yBase + (0.3 + TH * (n * 0.5 + 0.6)) * s, 0.2, 0.24 * s); // 罗汉枋
  ringBeam(mat.beam, a + reach, yBase + brH - 0.17, 0.26, 0.34);        // 撩檐枋
  return reach;
}

/* ---------------- 屋檐 ----------------
   八面曲面：举折（上陡下缓）＋ 角部起翘、出翘（沿径向外推，保证两面在角线处严丝合缝）。 */
function roofPt(r, i, u, v, out = new V3()) {
  const a = r.aIn + (r.aOut - r.aIn) * v;
  const y = r.yIn + (r.yOut - r.yIn) * (1 - Math.pow(1 - v, 1.5));
  const w = Math.pow(Math.abs(u), 3) * v * v;
  const [x, z] = octXZ(a, i, u), k = 1 + r.ext * w / (a / C8);
  return out.set(x * k, y + r.lift * w, z * k);
}
function roofGeo(r, dy = 0, segU = 22, segV = 14) {
  const pos = [], uv = [], idx = [], p = new V3(), slope = Math.hypot(r.aOut - r.aIn, r.yIn - r.yOut);
  for (let i = 0; i < 8; i++) {
    const b = pos.length / 3;
    for (let iv = 0; iv <= segV; iv++) for (let iu = 0; iu <= segU; iu++) {
      const u = -1 + 2 * iu / segU, v = iv / segV;
      roofPt(r, i, u, v, p); pos.push(p.x, p.y + dy, p.z);
      const a = r.aIn + (r.aOut - r.aIn) * v;
      uv.push(u * a * T8 / 0.75, v * slope / 1.1);
    }
    for (let iv = 0; iv < segV; iv++) for (let iu = 0; iu < segU; iu++) {
      const A = b + iv * (segU + 1) + iu, B = A + 1, C = A + segU + 1, D = C + 1;
      idx.push(A, C, B, B, C, D);
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  g.setIndex(idx); g.computeVertexNormals();
  return g;
}
function fasciaGeo(r, h = 0.42, segU = 22) {
  const pos = [], uv = [], idx = [], p = new V3();
  for (let i = 0; i < 8; i++) {
    const b = pos.length / 3;
    for (let iu = 0; iu <= segU; iu++) {
      roofPt(r, i, -1 + 2 * iu / segU, 1, p);
      pos.push(p.x, p.y + 0.02, p.z, p.x, p.y - h, p.z); uv.push(iu / segU, 1, iu / segU, 0);
    }
    for (let iu = 0; iu < segU; iu++) { const t = b + iu * 2; idx.push(t, t + 1, t + 2, t + 2, t + 1, t + 3); }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  g.setIndex(idx); g.computeVertexNormals();
  return g;
}
const SOFFIT = 0.4;
const roofCorners = [];
function eave(r, aCol, { innerRidge = true } = {}) {
  add(mat.tile, roofGeo(r));
  add(mat.soffit, roofGeo(r, -SOFFIT));
  add(mat.fascia, fasciaGeo(r));
  // 椽子：沿出檐方向排布，角部自然散开成翼角椽
  const v0 = Math.max(0, (aCol - 0.4 - r.aIn) / (r.aOut - r.aIn)), n = Math.round(2 * r.aOut * T8 / 0.42);
  const p0 = new V3(), p1 = new V3(), up = new V3(0, 1, 0);
  for (let i = 0; i < 8; i++) for (let k = 0; k < n; k++) {
    const u = -1 + (k + 0.5) * 2 / n;
    roofPt(r, i, u, v0, p0); roofPt(r, i, u, 0.985, p1);
    p0.y -= SOFFIT + 0.08; p1.y -= SOFFIT + 0.08;
    const len = p0.distanceTo(p1), g = new THREE.CylinderGeometry(0.07, 0.07, len, 6);
    g.applyQuaternion(new THREE.Quaternion().setFromUnitVectors(up, p1.clone().sub(p0).normalize()));
    g.translate((p0.x + p1.x) / 2, (p0.y + p1.y) / 2, (p0.z + p1.z) / 2);
    add(mat.rafter, g);
  }
  // 垂脊、套兽、风铃
  for (let i = 0; i < 8; i++) {
    const pts = [];
    for (let k = 0; k <= 12; k++) { const p = roofPt(r, i, 1, 0.02 + 0.98 * k / 12); p.y += 0.14; pts.push(p); }
    add(mat.ridge, new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 24, 0.17, 6));
    const end = roofPt(r, i, 1, 1);
    roofCorners.push({ r, i, end: end.clone() });
    add(mat.ridge, put(new THREE.SphereGeometry(0.24, 10, 8), end.x, end.y + 0.08, end.z));
    add(mat.bronze, put(new THREE.CylinderGeometry(0.015, 0.015, 0.5, 4), end.x, end.y - 0.45, end.z));
    add(mat.bronze, put(new THREE.CylinderGeometry(0.07, 0.19, 0.36, 8, 1, true), end.x, end.y - 0.86, end.z));
    add(mat.bronze, put(box(0.06, 0.3, 0.16), end.x, end.y - 1.15, end.z));
  }
  if (innerRidge) ringBeam(mat.ridge, r.aIn + 0.15, r.yIn + 0.05, 0.42, 0.4);
}

/* ---------------- 勾栏 ---------------- */
function railing(ra, y0) {
  for (let i = 0; i < 8; i++) {
    const len = 2 * ra * T8, [x, z] = octXZ(ra, i, 0), ry = i * Q;
    add(mat.rail, put(box(len + 0.12, 0.1, 0.1), x, y0 + 1.02, z, ry));   // 寻杖
    add(mat.rail, put(box(len + 0.12, 0.12, 0.09), x, y0 + 0.56, z, ry)); // 盆唇
    add(mat.rail, put(box(len + 0.12, 0.16, 0.14), x, y0 + 0.08, z, ry)); // 地栿
    add(mat.panel, put(box(len, 0.36, 0.04), x, y0 + 0.33, z, ry));       // 华板
    const n = Math.floor(len / 0.5);
    for (let k = 1; k < n; k++) {
      const [bx, bz] = octXZ(ra, i, -1 + 2 * k / n);
      add(mat.rail, put(box(0.06, 0.42, 0.06), bx, y0 + 0.8, bz, ry));    // 蜀柱
    }
  }
  for (const p of ring24(ra)) add(mat.rail, put(box(0.17, 1.28, 0.17), p.x, y0 + 0.64, p.z, p.ry)); // 望柱
}

/* ---------------- 墙身与门窗 ---------------- */
function bays(a, y0, h, colR, doorFor) {
  for (let i = 0; i < 8; i++) {
    const bw = 2 * a * T8 / 3;
    for (let b = 0; b < 3; b++) {
      const u = -2 / 3 + b * 2 / 3, [x, z] = octXZ(a - 0.03, i, u);
      const m = b === 1 ? doorFor(i) : mat.board;
      add(m, put(new THREE.PlaneGeometry(bw - colR * 1.6, h), x, y0 + h / 2, z, i * Q));
    }
  }
}

/* ---------------- 塑像（剖切可见） ---------------- */
const torsoProfile = [[0, 0], [0.8, 0], [0.86, 0.7], [0.78, 1.5], [0.98, 1.95], [0.62, 2.25], [0.26, 2.4], [0, 2.45]].map(([x, y]) => new THREE.Vector2(x, y));
function seated(m, x, y, z, h, ry = 0) {
  const s = h / 4.0, parts = [];
  parts.push(new THREE.SphereGeometry(1, 18, 12).scale(1.3 * s, 0.45 * s, 0.95 * s).translate(0, 0.45 * s, 0.12 * s));
  parts.push(new THREE.LatheGeometry(torsoProfile, 20).scale(s, s, 0.78 * s).translate(0, 0.5 * s, -0.05 * s));
  parts.push(new THREE.SphereGeometry(0.42 * s, 16, 12).translate(0, 3.3 * s, 0));
  parts.push(new THREE.SphereGeometry(0.2 * s, 10, 8).translate(0, 3.78 * s, 0));
  for (const g of parts) add(m, put(g, x, y, z, ry));
}
function altar(a, y0, h) { add(mat.rail, octPrism(a, y0, h)); add(mat.gold, octPrism(a * 0.92, y0 + h, 0.08)); return y0 + h + 0.08; }

/* ================================================================
   营造
   ================================================================ */
function buildTower() {
  /* 台基 */
  add(mat.stoneA, put(box(DIM.platLow.half * 2, DIM.platLow.h, DIM.platLow.half * 2), 0, DIM.platLow.h / 2, 0));
  add(mat.stoneB, octPrism(DIM.platUp.a, DIM.platLow.h, DIM.platUp.h));
  add(mat.stoneA, put(box(12, BASE, 3.5), 0, BASE / 2, 18.75));                    // 南月台
  for (const sx of [1, -1]) add(mat.stoneA, put(box(3.5, DIM.platUp.h, 10), sx * 18.75, DIM.platLow.h + DIM.platUp.h / 2, 0)); // 东西月台
  const N = 25, rise = BASE / N, run = 0.3;
  for (let s = 1; s < N; s++) add(mat.stoneB, put(box(6, BASE - s * rise, run), 0, (BASE - s * rise) / 2, 20.5 + (s - 0.5) * run));
  for (const sx of [1, -1]) {                                                      // 垂带
    const L = Math.hypot((N - 1) * run, BASE), g = box(0.6, 0.45, L); g.rotateX(Math.atan2(BASE, (N - 1) * run));
    add(mat.stoneA, g.translate(sx * 3.3, BASE / 2 + 0.05, 20.5 + (N - 1) * run / 2));
  }
  for (let k = 0; k < 8; k++) { const [x, z] = cornerXZ(DIM.platUp.a / C8 + 0.05, k); add(mat.stoneA, put(box(0.7, 0.55, 0.7), x, BASE - 0.28, z, Math.PI / 8 + k * Q)); } // 角石

  /* 一层：副阶 + 檐柱墙 */
  const f = DIM.fujie, l1 = DIM.l1;
  add(mat.wallL1, octPrism(l1.a + 0.05, BASE, l1.colH, { caps: false }));
  add(mat.wallL1, octPrism(5.13, BASE, 11.6, { caps: false }));                    // 内槽墙
  columns(mat.col, l1.a + 0.08, BASE, l1.colH, l1.colR);
  for (const i of [0, 4]) { const [x, z] = octXZ(l1.a + 0.09, i, 0); add(mat.doorL1, put(new THREE.PlaneGeometry(2.8, 4.6), x, BASE + 2.3, z, i * Q)); }
  columns(mat.col, f.a, BASE, f.colH, f.colR);
  add(mat.hidden, octPrism(f.a - 0.03, BASE + f.colH, f.brH + 0.15, { caps: false }));
  bracketRing(f.a, BASE + f.colH, f.brH, f.tiers, false);
  eave(f.roof, f.a, { innerRidge: true });
  add(mat.hidden, octPrism(l1.a - 0.05, BASE + l1.colH, l1.brH + 0.55, { caps: false }));
  bracketRing(l1.a, BASE + l1.colH, l1.brH, l1.tiers, l1.ang);
  eave(l1.roof, l1.a);
  add(mat.deck, octPrism(5.1, DIM.l1.roof.yIn - 0.3, 0.25));

  /* 二至五层，每层下有平坐暗层 */
  for (const L of DIM.upper) {
    add(mat.hidden, octPrism(L.a + 0.05, L.p0 - 0.7, L.deckY - 0.3 - (L.p0 - 0.7), { caps: false }));
    add(mat.deck, octPrism(L.a, L.p0 - 0.25, 0.22));                               // 暗层楼面
    bracketRing(L.pzA, L.p0, L.pzBrH, 3, false, { inter: true });                  // 平坐铺作
    add(mat.deck, octPrism(L.deckA, L.deckY - 0.3, 0.3));                          // 平坐楼面
    ringBeam(mat.beam, L.deckA, L.deckY - 0.22, 0.12, 0.44);
    railing(L.deckA - 0.14, L.deckY);
    columns(mat.col, L.a, L.deckY, L.colH, L.colR);
    bays(L.a, L.deckY, L.colH, L.colR, i => (i % 2 ? mat.door2 : mat.door4));
    add(mat.hidden, octPrism(L.a - 0.05, L.deckY + L.colH, L.brH + 0.55, { caps: false }));
    bracketRing(L.a, L.deckY + L.colH, L.brH, L.tiers, L.ang);
    eave(L.roof, L.a, { innerRidge: !L.top });
    // 内槽柱
    for (let k = 0; k < 8; k++) {
      const [x, z] = cornerXZ(L.a * 0.46 / C8, k);
      add(mat.col, put(new THREE.CylinderGeometry(0.32, 0.34, L.colH + L.brH, 12), x, L.deckY + (L.colH + L.brH) / 2, z));
      add(mat.col, put(new THREE.CylinderGeometry(0.3, 0.3, L.deckY - L.p0, 10), x, L.p0 + (L.deckY - L.p0) / 2, z));
    }
  }

  /* 塔像 */
  {
    const y = altar(3.4, BASE, 0.9);
    const y2 = altar(2.9, y, 0.6);
    add(mat.gold, put(new THREE.LatheGeometry([[0.4, 0], [2.3, 0.2], [2.85, 0.7], [2.6, 0.9], [0, 0.9]].map(([a, b]) => new THREE.Vector2(a, b)), 24), 0, y2, 0));
    seated(mat.gold, 0, y2 + 0.85, 0, 8.4);
    add(mat.gold, put(new THREE.TorusGeometry(3.0, 0.12, 8, 48), 0, y2 + 6.5, -1.4));
    add(mat.gold, put(new THREE.CircleGeometry(1.25, 32), 0, y2 + 7.8, -0.95));
  }
  {
    const [L2, L3, L4, L5] = DIM.upper;
    let y = altar(3.6, L2.deckY, 0.5);
    seated(mat.gold, 0, y, -0.6, 3.0); seated(mat.gold, 2.3, y, -0.2, 2.1); seated(mat.gold, -2.3, y, -0.2, 2.1);
    seated(mat.gold, 3.3, y, 1.2, 1.7); seated(mat.gold, -3.3, y, 1.2, 1.7);
    y = altar(3.3, L3.deckY, 0.5);
    for (let k = 0; k < 4; k++) { const t = k * Math.PI / 2; seated(mat.gold, Math.sin(t) * 1.5, y, Math.cos(t) * 1.5, 2.5, t); }
    y = altar(3.2, L4.deckY, 0.5);
    seated(mat.gold, 0, y, -0.3, 2.9);
    for (const [x, z] of [[2.2, 0.4], [-2.2, 0.4], [1.2, 1.8], [-1.2, 1.8]]) seated(mat.gold, x, y, z, 1.8);
    y = altar(3.0, L5.deckY, 0.5);
    seated(mat.gold, 0, y, 0, 2.6);
    for (let k = 0; k < 8; k++) { const t = k * Q; seated(mat.gold, Math.sin(t) * 2.4, y, Math.cos(t) * 2.4, 1.5, t); }
  }

  /* 塔刹 */
  const fy = FINIAL_BASE;
  add(mat.ridge, octPrism(1.15, fy - 0.4, 1.5));
  add(mat.iron, put(new THREE.LatheGeometry([[0.5, 0], [1.1, 0.25], [1.4, 0.62], [1.5, 0.82], [0.4, 0.82]].map(([a, b]) => new THREE.Vector2(a, b)), 24), 0, fy + 1.1, 0));
  add(mat.iron, put(new THREE.SphereGeometry(0.95, 24, 12, 0, Math.PI * 2, 0, Math.PI / 2).scale(1, 0.85, 1), 0, fy + 1.9, 0));
  add(mat.iron, put(new THREE.CylinderGeometry(0.09, 0.11, 10.0, 10), 0, fy + 6.0, 0));
  for (let k = 0; k < 5; k++) {
    const r = 0.98 - k * 0.1, y = fy + 3.2 + k * 0.72;
    add(mat.iron, put(new THREE.CylinderGeometry(r, r, 0.12, 28), 0, y, 0));
    add(mat.iron, put(new THREE.TorusGeometry(r, 0.05, 6, 28).rotateX(Math.PI / 2), 0, y, 0));
  }
  add(mat.iron, put(new THREE.TorusGeometry(0.72, 0.06, 8, 32), 0, fy + 7.4, 0));                            // 圆光
  add(mat.iron, put(new THREE.TorusGeometry(0.6, 0.075, 8, 24, Math.PI).rotateZ(Math.PI), 0, fy + 8.75, 0));  // 仰月
  add(mat.iron, put(new THREE.CylinderGeometry(0.15, 0.85, 0.34, 16), 0, fy + 9.2, 0));                      // 宝盖
  add(mat.iron, put(new THREE.SphereGeometry(0.32, 16, 12), 0, fy + 9.85, 0));                               // 宝珠
  add(mat.iron, put(new THREE.SphereGeometry(0.2, 12, 10), 0, fy + 10.4, 0));
  add(mat.iron, put(new THREE.CylinderGeometry(0.0, 0.06, 0.45, 8), 0, DIM.finialTop - 0.225, 0));
  const top = DIM.upper[3].roof;
  for (let i = 0; i < 8; i++) {                                                                               // 铁链
    const end = roofPt(top, i, 1, 1); end.y += 0.3;
    const start = new V3(end.x, 0, end.z).setLength(0.62); start.y = fy + 8.55;
    const mid = start.clone().lerp(end, 0.5); mid.y -= 1.4;
    add(mat.iron, new THREE.TubeGeometry(new THREE.QuadraticBezierCurve3(start, mid, end), 40, 0.045, 5));
  }

  const group = new THREE.Group();
  for (const [m, geos] of batch) {
    const mesh = new THREE.Mesh(mergeGeometries(geos), m);
    mesh.castShadow = true; mesh.receiveShadow = true;
    group.add(mesh);
  }
  batch.clear();
  return group;
}

/* 匾额 */
function plaque(text, vertical, w, h, x, y, z) {
  const cw = vertical ? 256 : 256 * text.length + 120, ch = vertical ? 256 * text.length * 0.78 + 120 : 300;
  const tex = canvasTex(cw, ch, (g, W, H) => {
    g.fillStyle = '#1d3644'; g.fillRect(0, 0, W, H);
    g.strokeStyle = '#c9a24a'; g.lineWidth = 14; g.strokeRect(14, 14, W - 28, H - 28);
    g.lineWidth = 4; g.strokeRect(38, 38, W - 76, H - 76);
    g.fillStyle = '#e5c770'; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.font = `900 ${vertical ? 170 : 190}px "Noto Serif SC", "Songti SC", serif`;
    [...text].forEach((c, k) => vertical ? g.fillText(c, W / 2, 60 + 256 * 0.78 * (k + 0.5)) : g.fillText(c, 60 + 256 * (k + 0.5), H / 2 + 6));
  }, { repeat: false });
  const grp = new THREE.Group();
  const frame = new THREE.Mesh(box(w + 0.3, h + 0.3, 0.14), mat.rail);
  const face = new THREE.Mesh(new THREE.PlaneGeometry(w, h), M({ map: tex, roughness: 0.6 }));
  face.position.z = 0.075;
  grp.add(frame, face); grp.position.set(x, y, z);
  frame.castShadow = true;
  return grp;
}

/* 地面、人物 */
function buildGround() {
  const g = new THREE.Group();
  const earth = new THREE.Mesh(new THREE.CircleGeometry(1400, 64).rotateX(-Math.PI / 2), new THREE.MeshStandardMaterial({ color: 0x9b8b6c, roughness: 1 }));
  earth.receiveShadow = true;
  const pave = new THREE.Mesh(new THREE.PlaneGeometry(130, 130).rotateX(-Math.PI / 2), new THREE.MeshStandardMaterial({ map: pavingTex, roughness: 0.95 }));
  pave.position.y = 0.02; pave.receiveShadow = true;
  g.add(earth, pave);
  const people = [[2.6, 0, 33, 0x2f4a6a], [-4.2, 0, 30.5, 0x7a3a2a], [6.5, BASE, 16.6, 0x3c3c3c], [-24, 0, 12, 0x5f6b3a]];
  for (const [x, y, z, c] of people) {
    const m = new THREE.MeshStandardMaterial({ color: c, roughness: 0.9 });
    const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.22, 1.05, 4, 10), m); body.position.set(x, y + 0.75, z);
    const head = new THREE.Mesh(new THREE.SphereGeometry(0.13, 12, 10), new THREE.MeshStandardMaterial({ color: 0xc89f7e })); head.position.set(x, y + 1.6, z);
    body.castShadow = head.castShadow = true;
    g.add(body, head);
  }
  return g;
}

/* 层位标注 */
const labelDefs = [
  ['台基', 0, '±0.00'],
  ['一层', BASE + 7.5, BASE.toFixed(2)],
  ...DIM.upper.flatMap((L, j) => [
    [`暗层 ${'一二三四'[j]}`, (L.p0 + L.deckY) / 2, L.p0.toFixed(2)],
    [`${'二三四五'[j]}层`, L.deckY + 2.2, L.deckY.toFixed(2)],
  ]),
  ['塔刹', FINIAL_BASE + 5.5, FINIAL_BASE.toFixed(2)],
  ['刹顶', DIM.finialTop, DIM.finialTop.toFixed(2)],
];
const labels = labelDefs.map(([name, y, elev]) => {
  const el = document.createElement('div'); el.className = 'lv';
  el.innerHTML = `<b>${name}</b>${elev} m`;
  const o = new CSS2DObject(el); o.userData.y = y; o.visible = false; scene.add(o); return o;
});

/* ---------------- 启动 ---------------- */
async function start() {
  try { await Promise.race([document.fonts.load('900 64px "Noto Serif SC"', '万古观瞻释迦塔天下奇峻极神工'), new Promise(r => setTimeout(r, 2500))]); } catch (e) {}
  const tower = buildTower();
  scene.add(tower, buildGround());
  const [L2, L3, L4, L5] = DIM.upper;
  const plaques = [
    plaque('万古观瞻', false, 3.0, 1.0, 0, 9.6, DIM.l1.a + 0.2),
    plaque('释迦塔', true, 1.0, 2.0, 0, L3.deckY + 3.9, L3.a + 1.95),
    plaque('天下奇观', false, 3.0, 1.0, 0, L4.deckY + 4.3, L4.a + 1.95),
    plaque('峻极神工', false, 3.0, 1.0, 0, L5.deckY + 4.3, L5.a + 1.95),
  ];
  scene.add(...plaques);
  const bb = new THREE.Box3().setFromObject(tower), size = bb.getSize(new V3());
  console.log('tower bbox (m):', size.x.toFixed(2), size.y.toFixed(2), size.z.toFixed(2), 'top y =', bb.max.y.toFixed(2));
  setSun(+document.getElementById('sun').value);
  const ld = document.getElementById('loading'); ld.style.opacity = '0'; setTimeout(() => ld.remove(), 700);
  renderer.setAnimationLoop(tick);
}

/* 视角动画 */
let fly = null;
function flyTo(p, t, dur = 1.6) {
  fly = { p0: camera.position.clone(), t0: controls.target.clone(), p1: new V3(...p), t1: new V3(...t), s: performance.now(), d: dur * 1000 };
}
controls.addEventListener('start', () => { fly = null; });
const views = {
  'v-all':  [[74, 26, 108], [0, 31, 0]],
  'v-dou':  [[17, 13, 31], [5, 15.5, 12]],
  'v-top':  [[13, 60, 20], [0, 59.5, 0]],
  'v-base': [[18, 7, 46], [0, 6, 14]],
};
for (const id in views) document.getElementById(id).addEventListener('click', () => flyTo(...views[id]));

let clipTarget = 60, clipC = 60;
const tCut = document.getElementById('t-cut'), tLab = document.getElementById('t-lab'), tRot = document.getElementById('t-rot');
const press = (b, v) => b.setAttribute('aria-pressed', String(v));
tCut.addEventListener('click', () => {
  const on = tCut.getAttribute('aria-pressed') !== 'true'; press(tCut, on);
  clipTarget = on ? 0 : 60;
  if (on) { flyTo([22, 26, 92], [0, 30, 0]); controls.autoRotate = false; press(tRot, false); }
});
tLab.addEventListener('click', () => { const on = tLab.getAttribute('aria-pressed') !== 'true'; press(tLab, on); labels.forEach(l => l.visible = on); });
tRot.addEventListener('click', () => { const on = tRot.getAttribute('aria-pressed') !== 'true'; press(tRot, on); controls.autoRotate = on; });
document.getElementById('sun').addEventListener('input', e => setSun(+e.target.value));
if (isSmall) document.getElementById('facts').open = false;
if (matchMedia('(prefers-reduced-motion: reduce)').matches) { controls.autoRotate = false; press(tRot, false); }

const right = new V3();
function tick(now) {
  if (fly) {
    const k = Math.min(1, (now - fly.s) / fly.d), e = k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
    camera.position.lerpVectors(fly.p0, fly.p1, e); controls.target.lerpVectors(fly.t0, fly.t1, e);
    if (k >= 1) fly = null;
  }
  clipC += (clipTarget - clipC) * 0.06; clipPlane.constant = clipC;
  controls.update();
  sky.position.copy(camera.position);
  right.setFromMatrixColumn(camera.matrixWorld, 0).setY(0).normalize();
  for (const l of labels) l.position.copy(right).multiplyScalar(21).setY(l.userData.y);
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}
function frame() {
  camera.aspect = innerWidth / innerHeight;
  if (innerWidth > 900) camera.setViewOffset(innerWidth, innerHeight, -170, 0, innerWidth, innerHeight);
  else if (innerWidth <= 640) camera.setViewOffset(innerWidth, innerHeight, 0, innerHeight * 0.16, innerWidth, innerHeight);
  else camera.clearViewOffset();
  camera.updateProjectionMatrix();
}
frame();
addEventListener('resize', () => {
  frame();
  renderer.setSize(innerWidth, innerHeight); labelRenderer.setSize(innerWidth, innerHeight);
});
start();
</script>
